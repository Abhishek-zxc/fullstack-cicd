services:

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "3000"
    depends_on:
      - database

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: trainingdb
      MYSQL_USER: traininguser
      MYSQL_PASSWORD: trainingpassword
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: